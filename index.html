<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: 'Outfit';
    }
    body{
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: hsl(212, 45%, 89%);
      width: 100vw;
      height: 100vh;
    }
   .qr-container{
      width: 320px;
      height: 499px;
      background-color:hsl(0, 0%, 100%);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .qr-container img{
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
 
    }
    .qr-container .heading{
      font-weight: 700;
      color: hsl(218, 44%, 22%);
      text-align: center;
      font-size: 22px;
      padding: 0 16px;
      margin: 24px 0px 16px;
    }
    .qr-container .description{
      font-size: 400;
      color: hsl(216, 15%, 48%);
      text-align: center;
      font-size: 15px;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div class="qr-container">
    <img src="/images/image-qr-code.png" alt="qr-image">
    <p class="heading">Improve your front-end skills by building projects</p>
    <p class="description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
</body>
</html>
